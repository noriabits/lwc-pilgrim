<template>
  <div class="slds-text-heading_small slds-p-bottom_small">Billing</div>
  <lightning-combobox
    label="Billing account"
    data-key="billingAccountId"
    value={value}
    options={options}
    onchange={handleChange}
    required
  ></lightning-combobox>
  <lightning-input
    label="PO number"
    data-key="poNumber"
    onchange={handleChange}
  ></lightning-input>
</template>
